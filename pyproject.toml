[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miseg-agent"
version = "0.1.0"
description = "Core implementation of MISeg-Agent: error diagnosis and executable prompt review"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Anonymous Authors"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "PyYAML>=6,<7", "SimpleITK>=2.3,<3", "torch>=2.1,<3"]

[project.optional-dependencies]
interactive = ["nninteractive==2.5.1"]

[project.scripts]
miseg-agent = "miseg_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"miseg_agent.routing" = ["resources/*.yaml", "resources/*.txt"]
