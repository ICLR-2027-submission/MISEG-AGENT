schema_version: 1
benchmark_id: miseg-agent-foundation-baselines-20260830
scope:
  modality: CT/CTA
  dimensions: 3
  task: whole-organ semantic segmentation
  cases: 90
  model_case_runs: 450
  datasets: 7
  validation: 450 predictions structurally validated; one empty SegVol KiTS19 prediction
    retained as Dice 0
quality_grades:
  source_metric: mean Dice
  reliability_source_metric: 10th-percentile Dice
  exact_values_exposed_to_agent: false
  thresholds:
    excellent: '>= 0.95'
    strong: '>= 0.90 and < 0.95'
    good: '>= 0.85 and < 0.90'
    fair: '>= 0.75 and < 0.85'
    weak: < 0.75
  rank:
    excellent: 5
    strong: 4
    good: 3
    fair: 2
    weak: 1
routing_policy:
  minimum_dataset_cases: 5
  default_accuracy_order:
  - quality_grade
  - reliability_grade
  - stable_case_key
  balanced_pareto_dimensions:
  - reliability_grade
  - mean_cold_start_wall_time_sec
  - peak_gpu_memory_delta_mb
  resource_objectives_require_top_quality_grade: true
  unrestricted_resource_objectives:
  - unrestricted_latency
  - unrestricted_gpu_memory
  note: Models in the same quality and reliability grades are not ordered by exact
    Dice or resources in accuracy mode.
